name: Issue-Comment

on:
  issues:
    types:
      - opened

permissions:
  issues: write

jobs:
  comment-with-action:
    runs-on: ubuntu-latest

    steps:
      - name: Github-Context
        run: echo '${{ toJSON(github.event) }}' | jq
        shell: bash

      - name: Create comment
        uses: peter-evans/create-or-update-comment@v5
        with:
          issue-number: ${{ github.event.issue.number }}
          body: |
            This is a multi-line test comment
            - With GitHub **Markdown** ✨
